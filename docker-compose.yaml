services:
  api:
    container_name: kalsite-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
    command: ["bun", "run", "start"]
    ports:
      # HOST:CONTAINER (OUTSIDE:INSIDE) — Docker cloudflared uses the RIGHT port: http://kalsite-backend:5000
      - "5000:5000"
    volumes:
      - kalsite_uploads:/usr/src/kalsite-backend/uploads
    restart: unless-stopped
    networks:
      - cloudflared_tunnel

volumes:
  kalsite_uploads:

networks:
  cloudflared_tunnel:
    external: true
